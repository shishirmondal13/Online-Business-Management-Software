name: smart_buy_online
description: "Smart Buy Online - Mobile & Gadget Business Management App"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  firebase_storage: ^13.0.5

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Local Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1

  # Utilities
  intl: any
  uuid: ^4.5.1
  connectivity_plus: ^7.0.0
  rxdart: ^0.28.0
  flutter_local_notifications: ^18.0.1
  path_provider: ^2.1.5

  # Export
  excel: ^4.0.6
  pdf: ^3.11.1
  printing: ^5.13.3
  open_file: ^3.5.10

  # Date & Time
  table_calendar: ^3.1.2
  fl_chart: ^1.1.1
  file_picker: ^12.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.4
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true
  generate: true

  # Assets will be added when needed
  assets:
    - assets/images/
  #   - assets/icons/

  # Custom fonts will be added when font files are available
  # fonts:
  #   - family: NotoSansBengali
  #     fonts:
  #       - asset: assets/fonts/NotoSansBengali-Regular.ttf
  #       - asset: assets/fonts/NotoSansBengali-Bold.ttf
  #         weight: 700
